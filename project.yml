name: Tinycast
options:
  bundleIdPrefix: com.tinycast
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top
  developmentLanguage: en
  knownRegions: [en, zh-Hans]

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    # A stable self-signed identity keeps the Accessibility grant across rebuilds. docs/signing.md
    CODE_SIGN_IDENTITY: "Tinycast Self-Signed"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_EMIT_LOC_STRINGS: YES
    TINYCAST_BUNDLE_IDENTIFIER: com.tinycast.app
  configs:
    Debug:
      TINYCAST_BUNDLE_IDENTIFIER: com.tinycast.app.dev
      DICTATION_EXECUTABLE_NAME: Tinycast Dev Dictation
    Release:
      DICTATION_EXECUTABLE_NAME: Tinycast Dictation
      # Release-only: library validation refuses Debug's `.debug.dylib`, whose team never matches.
      ENABLE_HARDENED_RUNTIME: YES
      # Strip the shipped binary (dSYM is still generated first) and drop unused code.
      DEPLOYMENT_POSTPROCESSING: YES
      STRIP_INSTALLED_PRODUCT: YES
      STRIP_SWIFT_SYMBOLS: YES
      DEAD_CODE_STRIPPING: YES

targets:
  CaptureWebP:
    type: library.static
    platform: macOS
    sources:
      - path: Vendor/libwebp/src
        excludes:
          - demux
          - mux/anim_encode.c
      - path: Vendor/libwebp/sharpyuv
    settings:
      base:
        PRODUCT_NAME: CaptureWebP
        GCC_C_LANGUAGE_STANDARD: c99
        GCC_OPTIMIZATION_LEVEL: "2"
        # Upstream's correlated branches trigger this optional Clang warning; keep source unchanged.
        GCC_WARN_UNINITIALIZED_AUTOS: YES
        GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "WEBP_USE_THREAD=1"]
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/Vendor/libwebp"]
        SKIP_INSTALL: YES
  Tinycast:
    type: application
    platform: macOS
    sources:
      - path: Tinycast
        # Helper-only sources: compiling them in would link Vision and PDFKit into the app.
        excludes:
          - Platform/TextRecognition/TextRecognitionExtractor.swift
          - Platform/TextRecognition/TextRecognitionHelper.swift
          - Platform/TextRecognition/ForegroundExtractor.swift
          - Features/Capture/Service/WebPHelper
          - Features/Dictation/Helper
          - Features/FileSearch/Helper
          - Features/Proxy/Helper
          - Resources/EmojiKeywords
      # A folder reference keeps the packs in their own directory, which `EmojiIndex` lists.
      - path: Tinycast/Resources/EmojiKeywords
        type: folder
      # The MIT mark's licence asks the notice to travel with the binary, not just the repo.
      - path: NOTICE.md
        buildPhase: resources
      - path: Vendor/libwebp/COPYING
        buildPhase: resources
      - path: Vendor/libwebp/PATENTS
        buildPhase: resources
      # GPL-3.0 asks for its text beside the binary, which ships only when fetched but is always disclosed.
      - path: Vendor/mihomo/mihomo-LICENSE
        buildPhase: resources
    dependencies:
      - target: DictationHelper
        link: false
        embed: false
      # Resolve the embedded helper against the active channel, not Xcode's default configuration.
      - framework: "$(BUILT_PRODUCTS_DIR)/$(DICTATION_EXECUTABLE_NAME).app"
        link: false
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      - target: CaptureWebP
      - target: CaptureWebPHelper
        link: false
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      - target: TextRecognitionHelper
        link: false
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      # The crawl runs out of process, so its memory is returned when the helper exits.
      - target: FileIndexHelper
        link: false
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      # Embedded by its own phase below, which signs it under the identifier the helper's grant pins.
      - target: TinycastProxyHelper
        link: false
        embed: false
    postBuildScripts:
      # The proxy's core is fetched, not committed; a build without it runs and reports the core missing.
      - name: Embed mihomo
        shell: /bin/bash
        basedOnDependencyAnalysis: false
        script: |
          core="$SRCROOT/build/vendor/mihomo/mihomo"
          helper="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers/mihomo"
          if [ ! -x "$core" ]; then
            echo "note: no mihomo core in build/vendor; run Scripts/fetch-mihomo.sh to bundle one"
            rm -f "$helper"
            exit 0
          fi
          mkdir -p "$(dirname "$helper")"
          rm -f "$helper"
          cp -c "$core" "$helper"
          if [ "$CODE_SIGNING_ALLOWED" = YES ] && [ -n "$EXPANDED_CODE_SIGN_IDENTITY" ]; then
            options=""
            if [ "$ENABLE_HARDENED_RUNTIME" = YES ]; then options="--options runtime"; fi
            codesign --force --timestamp=none --sign "$EXPANDED_CODE_SIGN_IDENTITY" $options \
              --identifier "$PRODUCT_BUNDLE_IDENTIFIER.mihomo" "$helper"
          fi
      # The TUN helper's copy in /Library is checked against this identifier and the signing leaf.
      - name: Embed TUN helper
        shell: /bin/bash
        basedOnDependencyAnalysis: false
        script: |
          helper="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers/TinycastProxyHelper"
          mkdir -p "$(dirname "$helper")"
          rm -f "$helper"
          cp -c "$BUILT_PRODUCTS_DIR/TinycastProxyHelper" "$helper"
          if [ "$CODE_SIGNING_ALLOWED" = YES ] && [ -n "$EXPANDED_CODE_SIGN_IDENTITY" ]; then
            options=""
            if [ "$ENABLE_HARDENED_RUNTIME" = YES ]; then options="--options runtime"; fi
            codesign --force --timestamp=none --sign "$EXPANDED_CODE_SIGN_IDENTITY" $options \
              --identifier "$PRODUCT_BUNDLE_IDENTIFIER.proxy-helper" "$helper"
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(TINYCAST_BUNDLE_IDENTIFIER)"
        SWIFT_INCLUDE_PATHS: ["$(inherited)", "$(SRCROOT)/Vendor/CaptureWebP"]
        INFOPLIST_FILE: Tinycast/Info.plist
        CODE_SIGN_ENTITLEMENTS: Tinycast/Tinycast.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: tinycast
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
      configs:
        # Debug is its own channel, so a local build never corrupts the installed app's state.
        Debug:
          PRODUCT_NAME: Tinycast Dev

  CaptureWebPHelper:
    type: tool
    platform: macOS
    sources:
      - Tinycast/Features/Capture/Service/WebPHelper/CaptureWebPHelper.swift
      - Tinycast/Features/Capture/Service/CaptureWebPEncoder.swift
      - Tinycast/Features/Capture/Service/CaptureWebPInput.swift
      - Tinycast/Features/Capture/Service/CapturePixelAlpha.swift
      - Tinycast/Features/Capture/Model/CapturePixelSize.swift
      - Tinycast/Features/Capture/Model/CaptureRasterError.swift
    dependencies:
      - target: CaptureWebP
    settings:
      base:
        EXECUTABLE_NAME: CaptureWebPHelper
        PRODUCT_MODULE_NAME: CaptureWebPHelper
        SWIFT_INCLUDE_PATHS: ["$(inherited)", "$(SRCROOT)/Vendor/CaptureWebP"]
        SWIFT_OPTIMIZATION_LEVEL: "-O"
        SKIP_INSTALL: YES

  TextRecognitionHelper:
    type: tool
    platform: macOS
    sources:
      - Tinycast/Platform/TextRecognition/TextRecognitionExtractor.swift
      - Tinycast/Platform/TextRecognition/TextRecognitionHelper.swift
      - Tinycast/Platform/TextRecognition/TextRecognitionResult.swift
      - Tinycast/Platform/TextRecognition/ForegroundExtractor.swift
    settings:
      base:
        # Pinned, or release.yml's PRODUCT_NAME renames the binary `TextRecognitionWorker` looks for.
        EXECUTABLE_NAME: TextRecognitionHelper
        PRODUCT_MODULE_NAME: TextRecognitionHelper
        SKIP_INSTALL: YES

  FileIndexHelper:
    type: tool
    platform: macOS
    sources:
      - Tinycast/Features/FileSearch/Helper/FileIndexHelper.swift
      - Tinycast/Features/FileSearch/Model/FileSearchIgnoreList.swift
      - Tinycast/Features/FileSearch/Model/FileSearchPolicy.swift
      - Tinycast/Features/FileSearch/Model/FileSearchQuery.swift
      - Tinycast/Features/FileSearch/Model/FileSearchScope.swift
      - Tinycast/Features/FileSearch/Service/FileIndexCrawler.swift
      - Tinycast/Features/FileSearch/Service/FileIndexSnapshot.swift
    settings:
      base:
        # Pinned like TextRecognitionHelper's: release.yml's PRODUCT_NAME would otherwise rename it.
        EXECUTABLE_NAME: FileIndexHelper
        PRODUCT_MODULE_NAME: FileIndexHelper
        SKIP_INSTALL: YES
        SWIFT_OPTIMIZATION_LEVEL: -O

  # Root's LaunchDaemon for TUN: shares the proxy model, and never the app's UI or AppKit.
  TinycastProxyHelper:
    type: tool
    platform: macOS
    sources:
      - Tinycast/Features/Proxy/Helper
      - Tinycast/Features/Proxy/Model
      - Tinycast/Features/Proxy/Service/ProxyAPIService.swift
      - Tinycast/Features/Proxy/Service/ProxyCodeSignature.swift
      - Tinycast/Features/Proxy/Service/ProxyCoreRunner.swift
      - Tinycast/Features/Proxy/Service/ProxyHelperWire.swift
      - Tinycast/Features/Proxy/Service/ProxySocket.swift
      - Tinycast/Features/Updates/Model/AppVersion.swift
      - Tinycast/Features/Updates/Model/ReleaseArchitecture.swift
      - Tinycast/Platform/ProcessExit.swift
    settings:
      base:
        EXECUTABLE_NAME: TinycastProxyHelper
        PRODUCT_MODULE_NAME: TinycastProxyHelper
        SKIP_INSTALL: YES
        SWIFT_OPTIMIZATION_LEVEL: -O

  DictationHelper:
    type: application
    platform: macOS
    info:
      path: Tinycast/Features/Dictation/Helper/Info.plist
      properties:
        CFBundleName: "$(DICTATION_EXECUTABLE_NAME)"
        CFBundleDisplayName: "$(DICTATION_EXECUTABLE_NAME)"
        LSUIElement: true
    sources:
      - Tinycast/Features/Dictation/Helper
      - Tinycast/Features/Dictation/Model/DictationModel.swift
      - Tinycast/Features/Dictation/Model/DictationAudioChunks.swift
      - Tinycast/Features/Dictation/Model/DictationLanguage.swift
      - Tinycast/Features/Dictation/Service/DictationWire.swift
    settings:
      base:
        EXECUTABLE_NAME: "$(DICTATION_EXECUTABLE_NAME)"
        PRODUCT_NAME: "$(DICTATION_EXECUTABLE_NAME)"
        WRAPPER_NAME: "$(DICTATION_EXECUTABLE_NAME).app"
        PRODUCT_MODULE_NAME: DictationHelper
        PRODUCT_BUNDLE_IDENTIFIER: "$(TINYCAST_BUNDLE_IDENTIFIER).dictation"
        SKIP_INSTALL: YES
        SWIFT_OPTIMIZATION_LEVEL: -O
