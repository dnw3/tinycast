name: CI

# Fork-only. The definition of done from docs/testing.md, run on every PR into `main` — the upstream
# sync PR included — and on `main` itself. Native acceptance stays manual.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.repository == 'dnw3/tinycast'
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7

      - name: Select the newest Xcode
        run: |
          XCODE_PATH="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n1)"
          if [ -z "$XCODE_PATH" ]; then
            echo "::error::No Xcode found on this runner."
            exit 1
          fi
          echo "Using $XCODE_PATH"
          echo "DEVELOPER_DIR=$XCODE_PATH/Contents/Developer" >> "$GITHUB_ENV"

      - name: Install tools
        run: |
          for tool in swiftlint xcodegen; do
            command -v "$tool" >/dev/null || brew install "$tool"
          done

      - name: Generated project matches project.yml
        run: |
          xcodegen generate
          git diff --exit-code -- Tinycast.xcodeproj

      - name: Model files import no UI framework
        run: |
          if grep -rln 'import AppKit\|import SwiftUI\|import Cocoa' Tinycast/Features/*/Model/; then
            echo "::error::A Features/*/Model file imports AppKit, SwiftUI or Cocoa."
            exit 1
          fi

      - name: Lint and localization
        run: ./Scripts/lint.sh

      - name: Debug and Release builds
        run: |
          for configuration in Debug Release; do
            log="$RUNNER_TEMP/build-$configuration.log"
            if ! xcodebuild build -project Tinycast.xcodeproj -scheme Tinycast \
              -configuration "$configuration" -derivedDataPath "$RUNNER_TEMP/DerivedData" \
              CODE_SIGNING_ALLOWED=NO > "$log" 2>&1; then
              grep -E 'error:' "$log" | sort -u | head -50
              tail -n 80 "$log"
              exit 1
            fi
            warnings=$(grep -E '\.swift:[0-9]+:[0-9]+: warning:' "$log" | sort -u)
            echo "$configuration: $(printf '%s' "$warnings" | grep -c . || true) Swift warnings" >> "$GITHUB_STEP_SUMMARY"
            if [ -n "$warnings" ]; then echo "$warnings" | sed 's/^/::warning::/'; fi
          done

      - name: Harnesses
        env:
          # Their results depend on the host, not the code: re-run them locally before merging.
          # capture-ocr-test: exact small-text OCR, and Vision's recognizer differs by macOS version.
          # form-input-test: measures offscreen-rendered glyph pixels, which this runner does not draw.
          HOST_DEPENDENT: capture-ocr-test form-input-test
        run: |
          if ./Scripts/run-tests.sh; then exit 0; fi
          failed=$(cd "${TMPDIR:-/tmp}/tinycast-harness" && ls *.failed 2>/dev/null | sed 's/\.failed$//')
          [ -n "$failed" ] || exit 1
          blocking=""
          for name in $failed; do
            if [[ " $HOST_DEPENDENT " == *" $name "* ]]; then
              echo "::warning::$name failed on this runner; it is host-dependent, so re-run it locally."
              echo "Host-dependent failure, verify locally: \`$name\`" >> "$GITHUB_STEP_SUMMARY"
              echo "HOST_WARNINGS=${HOST_WARNINGS:-}$name " >> "$GITHUB_ENV"
              HOST_WARNINGS="${HOST_WARNINGS:-}$name "
            else
              blocking="$blocking $name"
            fi
          done
          if [ -n "$blocking" ]; then
            echo "::error::Failed:$blocking"
            exit 1
          fi

      - name: Collect failure logs
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/failure-logs"
          cp "$RUNNER_TEMP"/build-*.log "$RUNNER_TEMP/failure-logs/" 2>/dev/null || true
          cp "${TMPDIR:-/tmp}"/tinycast-harness/*.log "$RUNNER_TEMP/failure-logs/" 2>/dev/null || true
          cp ~/Library/Logs/DiagnosticReports/*.ips "$RUNNER_TEMP/failure-logs/" 2>/dev/null || true

      - name: Keep failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs
          path: ${{ runner.temp }}/failure-logs
          if-no-files-found: ignore

      - name: Report the sync PR's result
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'upstream-main'
        env:
          LARK_WEBHOOK_URL: ${{ secrets.LARK_WEBHOOK_URL }}
          LARK_WEBHOOK_SECRET: ${{ secrets.LARK_WEBHOOK_SECRET }}
          RESULT: ${{ job.status }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          {
            if [ "$RESULT" = success ]; then
              echo "CI 通过，可以用 merge commit 合并。"
            else
              echo "CI 未通过（$RESULT），需要处理后再合并。"
            fi
            if [ -n "${HOST_WARNINGS:-}" ]; then echo "合并前请在本机复验：${HOST_WARNINGS}"; fi
          } | ./Scripts/notify-lark.sh "Tinycast · 同步 PR 的 CI 结果" "$PR_URL"
